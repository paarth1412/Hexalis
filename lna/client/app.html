<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Leave &amp; Attendance — HEXALIS</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<style nonce="{{NONCE}}">{{STYLES}}</style>
</head>
<body>
<header class="top">
  <div class="top__in">
    <a class="top__brand" href="/lna">{{LOGO}}<span>HEXALIS</span></a>
    <span class="top__app">Leave &amp; Attendance</span>
    <div class="top__me">
      <span class="who" id="who"></span>
      <button class="bell" id="bell" type="button" aria-label="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 16v-5a6 6 0 0 0-12 0v5l-2 2h16z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
        <span class="badge" id="bellCount" hidden></span>
      </button>
      <form method="post" action="/lna/logout"><button class="btn btn--quiet btn--sm" type="submit">Sign out</button></form>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</header>
<main id="view" aria-live="polite"><p class="empty">Loading…</p></main>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

<script nonce="{{NONCE}}">
"use strict";
(() => {
  const view = document.getElementById("view");
  const dlg = document.getElementById("dlg");
  const dlgBody = document.getElementById("dlgBody");
  let ME = null, CAL_MONTH = null, TEAM_DATE = null, TEAM_DEPT = "", FLASH = null, TIMER = null, REPORT = null, AUDIT = { person: "", items: [] };

  // ---- helpers ----------------------------------------------------------------
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const fmtDate = (d) => { if (!d) return ""; const [y, m, day] = d.split("-"); return `${+day} ${MONTHS[+m - 1]} ${y}`; };
  const fmtRange = (a, b) => a === b ? fmtDate(a) : `${fmtDate(a)} – ${fmtDate(b)}`;
  const fmtTime = (iso) => iso ? new Date(iso).toLocaleTimeString("en-IN", { timeZone: "Asia/Kolkata", hour: "numeric", minute: "2-digit" }) : "";
  const fmtWhen = (iso) => iso ? new Date(iso).toLocaleString("en-IN", { timeZone: "Asia/Kolkata", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }) : "";
  const fmtDays = (n) => `${n} day${n === 1 ? "" : "s"}`;
  const fmtHours = (min) => min === null || min === undefined ? "" : `${Math.floor(min / 60)}h ${String(min % 60).padStart(2, "0")}m`;
  const hhmmIST = (iso) => iso ? new Date(iso).toLocaleTimeString("en-GB", { timeZone: "Asia/Kolkata", hour: "2-digit", minute: "2-digit", hour12: false }) : "";
  const toMin = (s) => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
  const ROLE = { admin: "Admin", manager: "Manager", employee: "Employee" };
  const DAY_STATUS = { present: "Full day", half_day: "Half day", short: "Short hours" };
  const chip = (status, text) => `<span class="chip chip--${esc(status)}">${esc(text || status[0].toUpperCase() + status.slice(1))}</span>`;
  const flag = (text, kind) => `<span class="flag ${kind ? "flag--" + kind : ""}">${esc(text)}</span>`;
  const notice = (kind, text) => `<p class="notice notice--${kind}" role="${kind === "err" ? "alert" : "status"}">${esc(text)}</p>`;
  const opt = (value, label, sel) => `<option value="${esc(value)}" ${String(value) === String(sel ?? "") ? "selected" : ""}>${esc(label)}</option>`;
  const field = (id, label, input, extra = "") => `<div class="field" ${extra}><label for="${id}">${label}</label>${input}</div>`;

  async function api(path, body) {
    const opts = { credentials: "same-origin", headers: {} };
    if (body !== undefined) {
      opts.method = "POST";
      opts.headers["Content-Type"] = "application/json";
      opts.headers["X-LNA"] = "1";
      opts.body = JSON.stringify(body);
    }
    const res = await fetch("/lna/api" + path, opts);
    if (res.status === 401) { location.href = "/lna/login?m=expired"; throw new Error("signed out"); }
    if (res.status === 403) {
      const j = await res.json().catch(() => ({}));
      throw new Error(j.error || "Not allowed.");
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Something went wrong.");
    return data;
  }

  function openDialog(html, wide) { dlg.classList.toggle("wide", Boolean(wide)); dlgBody.innerHTML = html; dlg.showModal(); const f = dlgBody.querySelector("input,select,textarea,button"); if (f) f.focus(); }
  function closeDialog() { dlg.close(); dlgBody.innerHTML = ""; }
  function confirmBox(title, text, okLabel, danger) {
    return new Promise((resolve) => {
      openDialog(`<h2>${esc(title)}</h2><p class="dim">${esc(text)}</p>
        <div class="head mt"><span></span><span class="stat">
          <button class="btn btn--quiet" data-dlg="no">Cancel</button>
          <button class="btn ${danger ? "btn--danger" : ""}" data-dlg="yes">${esc(okLabel)}</button></span></div>`);
      dlgBody.onclick = (e) => { const b = e.target.closest("[data-dlg]"); if (!b) return; dlgBody.onclick = null; closeDialog(); resolve(b.dataset.dlg === "yes"); };
    });
  }
  dlg.addEventListener("click", (e) => {
    if (e.target.closest("[data-dlg-close]")) closeDialog();
    const c = e.target.closest("[data-dlg-copy]");
    if (c) navigator.clipboard.writeText(document.getElementById("secretVal").textContent).then(() => { c.textContent = "Copied"; });
  });

  // ---- notifications (bell) --------------------------------------------------------
  function setBell(n) { const b = document.getElementById("bellCount"); b.hidden = !n; b.textContent = n > 99 ? "99+" : n; }
  async function openBell() {
    const d = await api("/notifications");
    openDialog(`<div class="head"><h2>Notifications</h2><button class="btn btn--quiet btn--sm" data-dlg-close>Close</button></div>
      ${d.items.length ? `<ul class="notes">${d.items.map((n) => `<li><button data-note-link="${esc(n.link || "")}" class="${n.read_at ? "" : "new"}">${esc(n.text)}<time>${fmtWhen(n.created_at)}</time></button></li>`).join("")}</ul>` : `<p class="empty">Nothing yet.</p>`}`, true);
    if (d.unread) { await api("/notifications/read", {}); setBell(0); }
  }
  document.getElementById("bell").addEventListener("click", () => openBell().catch(() => {}));
  dlg.addEventListener("click", (e) => {
    const n = e.target.closest("[data-note-link]");
    if (!n) return;
    closeDialog();
    if (n.dataset.noteLink) { if (location.hash.slice(1) === n.dataset.noteLink) go(current()); else location.hash = n.dataset.noteLink; }
  });
  setInterval(() => { if (!document.hidden) api("/notifications").then((d) => setBell(d.unread)).catch(() => {}); }, 60000);

  // ---- tabs -------------------------------------------------------------------------
  function tabsFor(role) {
    const t = [["today", "Today"], ["leave", "Leave"]];
    if (role !== "employee") t.push(["approvals", "Approvals"], ["team", "Team"], ["reports", "Reports"]);
    if (role === "admin") t.push(["people", "People"], ["settings", "Settings"], ["activity", "Activity"]);
    t.push(["account", "Account"]);
    return t;
  }
  function renderTabs(active) {
    document.getElementById("tabs").innerHTML = tabsFor(ME.user.role).map(([k, label]) =>
      `<button class="tab" role="tab" aria-selected="${k === active}" data-tab="${k}">${label}${k === "approvals" && ME.pendingApprovals ? `<span class="badge">${ME.pendingApprovals}</span>` : ""}</button>`).join("");
  }
  function current() { const h = location.hash.slice(1); return tabsFor(ME.user.role).some(([k]) => k === h) ? h : "today"; }
  // Switching tabs reuses what we already know about you (refreshed quietly in
  // the background); after you change something it's fetched fresh first.
  let ME_AT = 0;
  async function refreshMe() { ME = await api("/me"); ME_AT = Date.now(); setBell(ME.unread); return ME; }
  async function go(tab, keepFlash, fresh) {
    if (!keepFlash) FLASH = null;
    if (TIMER) { clearInterval(TIMER); TIMER = null; }
    const stale = !ME || fresh || Date.now() - ME_AT > 60000;
    if (stale) await refreshMe();
    renderTabs(tab);
    try { await VIEWS[tab](); } catch (err) { view.innerHTML = notice("err", err.message); }
    if (!stale && Date.now() - ME_AT > 5000) refreshMe().then(() => renderTabs(current())).catch(() => {});
  }
  function flash(kind, text) { FLASH = { kind, text }; }
  const flashHtml = () => FLASH ? notice(FLASH.kind, FLASH.text) : "";

  // ---- Today ------------------------------------------------------------------------
  function greeting() { const h = +new Date().toLocaleString("en-GB", { timeZone: "Asia/Kolkata", hour: "2-digit", hour12: false }); return h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening"; }
  const approverName = () => ME.user.role !== "admin" && ME.user.manager ? ME.user.manager : "an admin";
  const shiftLine = () => `Shift ${ME.shift.start}–${ME.shift.end}${ME.shift.grace ? ` · late after ${hhmmLate()}` : ""}`;
  const hhmmLate = () => { const m = toMin(ME.shift.start) + ME.shift.grace; return `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`; };

  function todayCard() {
    const a = ME.attendance;
    if (ME.onLeave && !ME.onLeave.half_day) return `<p class="big">On leave</p><p class="dim">${esc(ME.onLeave.type)} today. Enjoy it.</p>`;
    if (a) {
      const mode = a.mode === "office" ? "Office" : "Work from home";
      const st = a.mode === "wfh" ? (a.status === "pending" ? chip("pending", `Waiting for ${approverName()}`) : a.status === "approved" ? chip("approved", "Approved") : chip("rejected", "Not approved")) : "";
      const flags = [a.late ? flag("Late arrival") : "", a.early ? flag("Left early") : "", a.day_status ? flag(DAY_STATUS[a.day_status], a.day_status === "present" ? "info" : a.day_status === "short" ? "bad" : "") : ""].join("");
      const remind = !a.check_out_at && ME.nowMin >= toMin(ME.shift.end) + 30 ? notice("info", `Your shift ended at ${ME.shift.end}. Remember to check out.`) : "";
      return `${remind}<div class="stat"><p class="big">${mode}</p>${st}</div>
        <p class="dim">Checked in at ${fmtTime(a.check_in_at)}${a.check_out_at ? ` · checked out at ${fmtTime(a.check_out_at)} · ${fmtHours(a.worked_min)} worked` : ""}</p>
        ${flags ? `<p>${flags}</p>` : ""}
        ${a.review_note ? `<p class="fine">Note: ${esc(a.review_note)}</p>` : ""}
        ${a.check_out_at ? "" : `<button class="btn btn--ghost mt" data-act="check-out">Check out</button>`}
        <p class="fine mt">${shiftLine()}</p>`;
    }
    const off = ME.holiday ? `Today is a holiday (${esc(ME.holiday)}).` : ME.weekend ? "It's your weekly day off." : "";
    const half = ME.onLeave && ME.onLeave.half_day ? `<p class="dim">You're on a half day of ${esc(ME.onLeave.type.toLowerCase())} today.</p>` : "";
    return `${half}${off ? `<p class="dim">${off} You can still check in if you're working.</p>` : `<p class="dim">You haven't checked in yet.</p>`}
      <div class="punch">
        <button data-act="check-in" data-mode="office"><b>Office</b><span>${ME.officeCheck ? "Your location is checked once" : "I'm working from the office"}</span></button>
        <button data-act="check-in" data-mode="wfh"><b>Work from home</b><span>Needs approval from ${esc(approverName())}</span></button>
      </div>
      <p class="fine mt">${shiftLine()}</p>`;
  }

  async function calendarHtml(pre) {
    const d = await (pre || api("/month?month=" + CAL_MONTH));
    const [y, m] = d.month.split("-").map(Number);
    const first = new Date(Date.UTC(y, m - 1, 1)).getUTCDay();
    const days = new Date(Date.UTC(y, m, 0)).getUTCDate();
    const att = Object.fromEntries(d.attendance.map((a) => [a.date, a]));
    const hol = Object.fromEntries(d.holidays.map((h) => [h.date, h.name]));
    const cells = [];
    const lead = (first + 6) % 7; // weeks start Monday
    for (let i = 0; i < lead; i++) cells.push(`<div class="day day--blank"></div>`);
    for (let n = 1; n <= days; n++) {
      const ds = `${d.month}-${String(n).padStart(2, "0")}`;
      const wd = new Date(ds + "T00:00:00Z").getUTCDay();
      const lv = d.leaves.find((l) => l.start_date <= ds && l.end_date >= ds && !(d.weekend.includes(wd) || hol[ds]));
      const a = att[ds];
      let cls = "", label = "", flags = "";
      if (a) {
        if (a.mode === "office") { cls = "office"; label = "Office"; }
        else if (a.status === "approved") { cls = "wfh"; label = "WFH"; }
        else if (a.status === "pending") { cls = "pending"; label = "WFH pending"; }
        else { cls = "absent"; label = "WFH declined"; }
        if (a.late) flags += flag("Late");
        if (a.day_status === "half_day") flags += flag("Half");
        else if (a.day_status === "short") flags += flag("Short", "bad");
        else if (!a.check_out_at && ds < d.today) flags += flag("No out", "bad");
      }
      else if (hol[ds]) { cls = "off"; label = hol[ds]; }
      else if (lv && lv.status === "approved") { cls = "leave"; label = lv.half_day ? "Half day" : "Leave"; }
      else if (lv) { cls = "pending"; label = "Leave pending"; }
      else if (d.weekend.includes(wd)) { cls = "off"; }
      else if (ds < d.today && ds >= d.since) { cls = "absent"; label = "No record"; }
      cells.push(`<div class="day ${cls ? "day--" + cls : ""} ${ds === d.today ? "day--today" : ""}"><span class="day__n">${n}</span><span class="day__t">${esc(label)}</span>${flags}</div>`);
    }
    const [py, pm] = m === 1 ? [y - 1, 12] : [y, m - 1];
    const [ny, nm] = m === 12 ? [y + 1, 1] : [y, m + 1];
    const mk = (yy, mm) => `${yy}-${String(mm).padStart(2, "0")}`;
    const days2 = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map((x) => `<div class="cal__dow">${x}</div>`).join("");
    return `<div class="head"><h2>${MONTHS[m - 1]} ${y}</h2><span class="stat">
        <button class="btn btn--quiet btn--sm" data-act="cal" data-month="${mk(py, pm)}" aria-label="Previous month">‹</button>
        <button class="btn btn--quiet btn--sm" data-act="cal" data-month="${d.today.slice(0, 7)}">This month</button>
        <button class="btn btn--quiet btn--sm" data-act="cal" data-month="${mk(ny, nm)}" aria-label="Next month">›</button></span></div>
      <div class="cal">${days2}${cells.join("")}</div>
      <div class="legend"><span><i class="day--office"></i>Office</span><span><i class="day--wfh"></i>Work from home</span><span><i class="day--pending"></i>Waiting for approval</span><span><i class="day--leave"></i>Leave</span><span><i class="day--absent"></i>No record</span><span><i class="day--off"></i>Day off / holiday</span></div>`;
  }

  function correctionDialog(date, kind) {
    openDialog(`<h2>Correct your attendance</h2>
      <p class="dim">For a day you forgot to check in or out, or checked in at the wrong time. It goes to ${esc(approverName())} for approval.</p>
      <form data-form="correction" class="mt">
        ${field("cd", "Date", `<input class="input" id="cd" name="date" type="date" required max="${ME.today}" min="${ME.user.since > addDaysLocal(ME.today, -15) ? ME.user.since : addDaysLocal(ME.today, -15)}" value="${esc(date || "")}"><p class="fine">Up to 15 days back.</p>`)}
        ${field("ck", "What needs correcting", `<select class="input" id="ck" name="kind">${opt("out", "Check-out time", kind)}${opt("in", "Check-in time", kind)}${opt("both", "Both (or the whole day is missing)", kind)}</select>`)}
        <div class="grid g2">
          ${field("ci", "Check-in time", `<input class="input" id="ci" name="check_in" type="time">`, `data-for="in both"`)}
          ${field("co", "Check-out time", `<input class="input" id="co" name="check_out" type="time">`, `data-for="out both"`)}
        </div>
        ${field("cm", "Where were you working?", `<select class="input" id="cm" name="mode">${opt("office", "Office")}${opt("wfh", "Work from home")}</select><p class="fine">Only used if there's no record for that day at all.</p>`, `data-for="both"`)}
        ${field("cr", "What happened?", `<textarea class="input" id="cr" name="reason" maxlength="300" required placeholder="e.g. Forgot to check out before leaving"></textarea>`)}
        <div class="head mt"><span></span><span class="stat"><button class="btn btn--quiet" type="button" data-dlg-close>Cancel</button><button class="btn" type="submit">Send request</button></span></div>
      </form>`);
    const sel = document.getElementById("ck");
    const sync = () => dlgBody.querySelectorAll("[data-for]").forEach((el) => { const on = el.dataset.for.split(" ").includes(sel.value); el.hidden = !on; const i = el.querySelector("input"); if (i) i.required = on; });
    sel.addEventListener("change", sync); sync();
  }
  function addDaysLocal(s, n) { const d = new Date(s + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }

  const VIEWS = {};
  VIEWS.today = async () => {
    CAL_MONTH = CAL_MONTH || ME.today.slice(0, 7);
    const pend = ME.user.role !== "employee" && ME.pendingApprovals
      ? notice("info", `${ME.pendingApprovals} request${ME.pendingApprovals === 1 ? " is" : "s are"} waiting for your approval.`) : "";
    const open = ME.openDays.length ? `<div class="notice notice--err" role="alert">You didn't check out on ${ME.openDays.map(fmtDate).join(", ")}.
        ${ME.openDays.map((d) => `<button class="btn btn--quiet btn--sm" data-act="correct" data-date="${d}" data-kind="out">Fix ${fmtDate(d)}</button>`).join(" ")}</div>` : "";
    // Both requests go out at the same time.
    const monthP = api("/month?month=" + CAL_MONTH);
    monthP.catch(() => {});
    const corr = await api("/corrections");
    const crow = corr.items.map((c) => {
      const what = c.kind === "in" ? `Check-in ${hhmmIST(c.check_in_at)}` : c.kind === "out" ? `Check-out ${hhmmIST(c.check_out_at)}` : `${hhmmIST(c.check_in_at)}–${hhmmIST(c.check_out_at)}${c.mode ? ` (${c.mode === "wfh" ? "WFH" : "office"})` : ""}`;
      return `<tr><td>${fmtDate(c.date)}</td><td>${what}</td><td>${chip(c.status, c.status === "pending" ? "Waiting" : null)}${c.reviewer ? `<div class="fine">by ${esc(c.reviewer)}${c.review_note ? ` — ${esc(c.review_note)}` : ""}</div>` : ""}</td>
        <td class="actions">${c.status === "pending" ? `<button class="btn btn--quiet btn--sm" data-act="cancel-correction" data-id="${c.id}">Withdraw</button>` : ""}</td></tr>`;
    }).join("");
    view.innerHTML = `${flashHtml()}${pend}${open}
      <div class="head"><div><p class="eyebrow">${fmtDate(ME.today)}</p><h1>${greeting()}, ${esc(ME.user.name.split(" ")[0])}</h1></div></div>
      <div class="grid g2">
        <div>
          <section class="card"><h2>Today</h2>${todayCard()}</section>
          <section class="card mt"><div class="head"><h2>Corrections</h2><button class="btn btn--ghost btn--sm" data-act="correct">Request a correction</button></div>
            ${crow ? `<div class="scroll"><table class="tbl"><thead><tr><th>Date</th><th>Change</th><th>Status</th><th></th></tr></thead><tbody>${crow}</tbody></table></div>` : `<p class="dim">Forgot to check in or out? Request a correction and ${esc(approverName())} can approve it.</p>`}
          </section>
        </div>
        <section class="card" id="calCard"><p class="empty">Loading calendar…</p></section>
      </div>`;
    document.getElementById("calCard").innerHTML = await calendarHtml(monthP);
  };

  // ---- Leave ------------------------------------------------------------------------
  let LEAVE_TYPES = [];
  VIEWS.leave = async () => {
    const d = await api("/leave");
    LEAVE_TYPES = d.balances;
    const types = d.balances.map((b) => `<option value="${b.id}">${esc(b.name)}${b.remaining === null ? "" : ` (${b.remaining} available)`}</option>`).join("");
    const bal = d.balances.map((b) => `<div class="bal"><p>${esc(b.name)}</p>
        <div class="bal__n">${b.remaining === null ? "No limit" : esc(b.remaining)}</div>
        <p>${b.quota === null ? `${b.approved} taken this year` : b.accrual !== "yearly" ? `available · ${b.earned} of ${b.quota} given so far${b.accrual === "days" ? ` (1 per ${b.accrual_days} days)` : ""} · ${b.approved} taken` : `left of ${b.quota} · ${b.approved} taken`}${b.pending ? ` · ${b.pending} pending` : ""}</p></div>`).join("");
    const docRules = d.balances.filter((b) => b.doc_after_days !== null).map((b) => `${esc(b.name)} over ${fmtDays(b.doc_after_days)}`).join(", ");
    const rows = d.requests.map((r) => {
      const canCancel = r.status === "pending" || (r.status === "approved" && r.start_date > d.today);
      return `<tr><td>${fmtRange(r.start_date, r.end_date)}${r.half_day ? " (half day)" : ""}</td><td>${esc(r.type)}${r.doc_name ? `<div class="fine"><a href="/lna/api/leave/${r.id}/document">${esc(r.doc_name)}</a></div>` : ""}</td><td>${r.days}</td>
        <td>${chip(r.status)}${r.reviewer ? `<div class="fine">by ${esc(r.reviewer)}${r.review_note ? ` — ${esc(r.review_note)}` : ""}</div>` : ""}</td>
        <td class="actions">${canCancel ? `<button class="btn btn--quiet btn--sm" data-act="cancel-leave" data-id="${r.id}">Cancel</button>` : ""}</td></tr>`;
    }).join("");
    const wfh = d.wfh.map((a) => `<tr><td>${fmtDate(a.date)}</td><td>${fmtTime(a.check_in_at)}</td>
        <td>${chip(a.status, a.status === "approved" ? "Approved" : a.status === "pending" ? "Waiting" : "Not approved")}${a.reviewer ? `<div class="fine">by ${esc(a.reviewer)}${a.review_note ? ` — ${esc(a.review_note)}` : ""}</div>` : ""}</td></tr>`).join("");
    const minStart = d.since > `${d.today.slice(0, 4)}-01-01` ? d.since : `${d.today.slice(0, 4)}-01-01`;
    view.innerHTML = `${flashHtml()}
      <div class="head"><div><p class="eyebrow">${d.year}</p><h1>Leave</h1></div></div>
      <div class="grid g3">${bal}</div>
      <div class="grid g2 mt">
        <section class="card"><h2>Apply for leave</h2>
          <form data-form="leave">
            ${field("lt", "Type", `<select class="input" id="lt" name="leave_type_id" required>${types}</select>`)}
            <div class="grid g2">
              ${field("ls", "From", `<input class="input" id="ls" name="start_date" type="date" required min="${minStart}">`)}
              ${field("le", "To", `<input class="input" id="le" name="end_date" type="date" required>`)}
            </div>

      [c.notOut, "Didn't check out", c.notOut ? "bad" : ""], [c.early, "Left early", c.early ? "warn" : ""],

      ${d.holiday ? notice("info", `${fmtDate(d.date)} is a holiday: ${d.holiday}.`) : d.weekend ? notice("info", `${fmtDate(d.date)} is a weekly day off.`) : ""}

        <p class="dim">Leave "Days per year" blank for no limit (for example unpaid leave or absence). "1 day every N days" gives a day for every N days completed, up to the yearly total; "Built up monthly" gives 1/12 a month. Both count from 1 January or the joining date. Unused leave doesn't carry into the next year.</p>
        <table class="tbl mt"><tbody>${typeRows}</tbody></table>
        <form data-form="save-type" class="grid g3 mt">
          ${field("tnn", "New leave type", `<input class="input" id="tnn" name="name" required placeholder="e.g. Maternity leave">`)}
          ${field("tqn", "Days per year", `<input class="input" id="tqn" name="yearly_quota" type="number" min="0" max="366" step="0.5" placeholder="No limit">`)}
          ${field("tan", "Given", `<select class="input" id="tan" name="accrual">${opt("yearly", "All on 1 January", null)}${opt("monthly", "Built up monthly", null)}${opt("days", "1 day every N days", null)}</select>`)}
          ${field("tevn", "N (days)", `<input class="input" id="tevn" name="accrual_days" type="number" min="1" max="365" step="1" placeholder="e.g. 20">`)}
          ${field("tdn", "Document needed after (days)", `<input class="input" id="tdn" name="doc_after_days" type="number" min="0" max="366" step="0.5" placeholder="Never">`)}
          <div class="field"><span class="label">&nbsp;</span><button class="btn btn--ghost" type="submit">Add leave type</button></div>
        </form>
      </section>
      <section class="card mt"><h2>Holidays</h2>
        <form data-form="add-holiday" class="grid g3">
          ${field("hd", "Date", `<input class="input" id="hd" name="date" type="date" required>`)}
          ${field("hn", "Name", `<input class="input" id="hn" name="name" required maxlength="80">`)}
          <div class="field"><span class="label">&nbsp;</span><button class="btn btn--ghost" type="submit">Add holiday</button></div>
        </form>
        ${hol ? `<table class="tbl mt"><tbody>${hol}</tbody></table>` : `<p class="empty">No holidays added for this year.</p>`}
        <p class="fine">Payroll exports are under Reports.</p>
      </section>${emailCard}`;
  };

  // ---- Activity (admin) --------------------------------------------------------------
  const ACTIONS = {
    "login.password": "Signed in", "login.google": "Signed in with Google", "login.failed": "Wrong password", "login.locked": "Account locked",
    "password.changed": "Changed password", "password.temp_cancelled_by_google": "Temporary password cancelled (Google sign-in)",
    "attendance.check_in": "Checked in", "attendance.check_out": "Checked out", "correction.requested": "Asked for a correction",
    "correction.cancelled": "Withdrew a correction", "correction.approved": "Approved a correction", "correction.rejected": "Rejected a correction",
    "leave.applied": "Applied for leave", "leave.cancelled": "Cancelled leave", "leave.approved": "Approved leave", "leave.rejected": "Rejected leave",
    "leave.document_viewed": "Opened a leave document", "wfh.approved": "Approved work from home", "wfh.rejected": "Rejected work from home",
    "profile.updated": "Updated their profile", "report.downloaded": "Downloaded a report", "admin.person_added": "Added a person",
    "admin.person_updated": "Edited a person", "admin.password_reset": "Reset a password", "admin.leave_type_saved": "Saved a leave type",
    "admin.holiday_added": "Added a holiday", "admin.holiday_removed": "Removed a holiday", "admin.settings_saved": "Changed settings",
    "cli.person_added": "Account created from the terminal", "admin.signed_out_person": "Signed someone out everywhere", "profile.email_preference": "Changed email preference",
    "admin.email_test": "Sent a test email", "admin.email_retry": "Retried failed emails",
  };
  const detailText = (s) => { if (!s) return ""; try { return Object.entries(JSON.parse(s)).filter(([, v]) => v !== null && v !== "").map(([k, v]) => `${k.replace(/_/g, " ")}: ${v}`).join(" · "); } catch { return s; } };
  VIEWS.activity = async (more) => {
    if (!PEOPLE.length) PEOPLE = (await api("/admin/people")).people;
    const before = more && AUDIT.items.length ? AUDIT.items[AUDIT.items.length - 1].id : "";
    const d = await api(`/admin/audit?person=${AUDIT.person}&before=${before}`);
    AUDIT.items = more ? AUDIT.items.concat(d.items) : d.items;
    const rows = AUDIT.items.map((a) => `<tr><td>${fmtWhen(a.at)}</td><td>${esc(a.name || "—")}</td><td>${esc(ACTIONS[a.action] || a.action)}</td><td class="fine">${esc(detailText(a.detail))}</td></tr>`).join("");
    view.innerHTML = `<div class="head"><div><p class="eyebrow">Admin</p><h1>Activity</h1></div>
        <div class="filters">${field("ap", "Person", `<select class="input" id="ap">${opt("", "Everyone", AUDIT.person)}${PEOPLE.map((p) => opt(p.id, p.name, AUDIT.person)).join("")}</select>`)}</div></div>
      <p class="dim">Every sign-in, request, decision and admin change, newest first.</p>
      <section class="card mt">${rows ? `<div class="scroll"><table class="tbl"><thead><tr><th>When</th><th>Who</th><th>What</th><th>Details</th></tr></thead><tbody>${rows}</tbody></table></div>` : `<p class="empty">Nothing recorded yet.</p>`}
        ${d.items.length === 100 ? `<button class="btn btn--quiet mt" data-act="audit-more">Show older</button>` : ""}</section>`;
    document.getElementById("ap").addEventListener("change", (e) => { AUDIT.person = e.target.value; VIEWS.activity(); });
  };

  // ---- Account ------------------------------------------------------------------------
  VIEWS.account = async () => {
    const u = ME.user;
    const p = (await api("/profile")).profile;
    const info = [["Email", p.email], ["Employee ID", p.employee_code], ["Department", p.department], ["Designation", p.designation],
      ["Joined", p.joining_date ? fmtDate(p.joining_date) : ""], ["Reports to", p.manager || (u.role === "employee" ? "No manager (admins approve)" : "")],
      ["Your requests go to", u.role === "employee" ? (u.manager ? u.manager + " or an admin" : "An admin") : "An admin"]]
      .filter(([, v]) => v).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("");
    view.innerHTML = `${flashHtml()}<div class="head"><div><p class="eyebrow">${ROLE[u.role]}</p><h1>${esc(u.name)}</h1></div></div>
      <div class="grid g2">
        <div>
          <section class="card"><h2>Details</h2><dl class="kv">${info}</dl>
            <p class="fine mt">Your name, ID, department and joining date are set by an admin.</p>
            <button class="btn btn--quiet mt" data-act="sign-out-others">Sign out of all other devices</button>
          </section>
          <section class="card mt"><h2>Email</h2>
            <label class="check"><input type="checkbox" data-act="email-pref" ${p.email_notify ? "checked" : ""}> Email me about requests, decisions and reminders</label>
            <p class="fine">Sent to ${esc(u.email)}. You sign in with your Google account; there's no separate password.</p>
          </section>
        </div>
        <section class="card"><h2>Contact and emergency details</h2>
          <p class="dim">Seen only by you and admins.</p>
          <form data-form="profile" class="mt">
            <div class="grid g2">
              ${field("fp", "Mobile number", `<input class="input" id="fp" name="phone" type="tel" maxlength="20" value="${esc(p.phone || "")}" autocomplete="tel">`)}
              ${field("fb", "Date of birth", `<input class="input" id="fb" name="dob" type="date" max="${ME.today}" value="${esc(p.dob || "")}">`)}
            </div>
            ${field("fa", "Address", `<textarea class="input" id="fa" name="address" maxlength="300" autocomplete="street-address">${esc(p.address || "")}</textarea>`)}
            <div class="grid g2">
              ${field("fen", "Emergency contact name", `<input class="input" id="fen" name="emergency_name" maxlength="80" value="${esc(p.emergency_name || "")}">`)}
              ${field("fer", "Relationship", `<input class="input" id="fer" name="emergency_relation" maxlength="40" value="${esc(p.emergency_relation || "")}" placeholder="e.g. Mother">`)}
            </div>
            ${field("fep", "Emergency contact number", `<input class="input" id="fep" name="emergency_phone" type="tel" maxlength="20" value="${esc(p.emergency_phone || "")}">`)}
            <p class="fine">Your birthday (day and month only) is shown to your team on the day.</p>
            <button class="btn mt" type="submit">Save details</button>
          </form>
        </section>
      </div>`;
  };

  // ---- actions ------------------------------------------------------------------------
  async function run(fn, okText, then) {
    try { await fn(); if (okText) flash("ok", okText); }
    catch (err) { if (err.message !== "signed out" && err.message !== "change") flash("err", err.message); }
    await go(then || current(), true, true);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
  function position() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) return reject(new Error("This browser can't share your location."));
      navigator.geolocation.getCurrentPosition((p) => resolve(p.coords), (e) => reject(new Error(e.code === 1
        ? "Location access is blocked. Allow it for this site in your browser settings, then try again."
        : "Couldn't get your location. Try again, or check in as work from home.")), { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
    });
  }
  async function fileToBase64(file) {
    const bytes = new Uint8Array(await file.arrayBuffer());
    let s = "";
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(s);
  }

  document.addEventListener("click", async (e) => {
    const tab = e.target.closest("[data-tab]");
    if (tab) { if (location.hash.slice(1) === tab.dataset.tab) go(tab.dataset.tab); else location.hash = tab.dataset.tab; return; }
    const b = e.target.closest("[data-act]");
    if (!b) return;
    const id = Number(b.dataset.id);
    switch (b.dataset.act) {
      case "check-in": {
        const mode = b.dataset.mode;
        if (mode === "wfh" && !(await confirmBox("Work from home today?", `This sends today to ${approverName()} for approval.`, "Check in from home"))) return;
        let where = {};
        if (mode === "office" && ME.officeCheck) {
          b.disabled = true;
          try { const c = await position(); where = { lat: c.latitude, lon: c.longitude }; }
          catch (err) { flash("err", err.message); return go("today", true); }
        }
        return run(async () => { const r = await api("/check-in", { mode, ...where }); if (r.late) flash("ok", "Checked in. This is marked as a late arrival."); },
          mode === "office" ? "Checked in at the office." : "Checked in from home. Waiting for approval.");
      }
      case "check-out":
        if (!(await confirmBox("Check out for today?", "You can't check in again today after this. If you check out by mistake, request a correction.", "Check out"))) return;
        return run(() => api("/check-out", {}), "Checked out. See you tomorrow.");
      case "cal": CAL_MONTH = b.dataset.month; document.getElementById("calCard").innerHTML = await calendarHtml(); return;
      case "correct": return correctionDialog(b.dataset.date, b.dataset.kind || "out");
      case "cancel-correction":
        if (!(await confirmBox("Withdraw this correction?", "It won't be sent for approval.", "Withdraw", true))) return;
        return run(() => api(`/corrections/${id}/cancel`, {}), "Correction withdrawn.");
      case "cancel-leave":
        if (!(await confirmBox("Cancel this leave?", "It will be withdrawn. You can apply again later.", "Cancel leave", true))) return;
        return run(() => api(`/leave/${id}/cancel`, {}), "Leave cancelled.");
      case "team-balances": b.disabled = true; return teamBalances().catch((err) => { document.getElementById("balCard").innerHTML = notice("err", err.message); });
      case "audit-more": return VIEWS.activity(true);
      case "email-pref": return run(() => api("/profile", { email_notify: b.checked }), b.checked ? "Emails turned on." : "Emails turned off. You'll still get security emails.");
      case "email-test": b.disabled = true; return run(async () => { const r = await api("/admin/email/test", {}); flash("ok", `Test email sent to ${r.to}. Check the inbox (and spam).`); }, null);
      case "email-retry": return run(async () => { const r = await api("/admin/email/retry", {}); flash("ok", `${r.count} email(s) queued again.`); }, null);
      case "use-location":
        try { const c = await position(); document.getElementById("sla").value = c.latitude.toFixed(6); document.getElementById("slo").value = c.longitude.toFixed(6); if (document.getElementById("sr").value === "0") document.getElementById("sr").value = "200"; }
        catch (err) { openDialog(`<h2>Location</h2><p class="dim">${esc(err.message)}</p><div class="head mt"><span></span><button class="btn" data-dlg-close>OK</button></div>`); }
        return;
      case "edit-person": {
        const p = PEOPLE.find((x) => x.id === id);
        const contact = [["Mobile", p.phone], ["Emergency contact", [p.emergency_name, p.emergency_relation && `(${p.emergency_relation})`, p.emergency_phone].filter(Boolean).join(" ")]]
          .filter(([, v]) => v).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("");
        openDialog(`<h2>Edit ${esc(p.name)}</h2><p class="fine">${esc(p.email)}</p>
          <form data-form="edit-person" data-id="${p.id}" class="mt">
            ${field("en", "Full name", `<input class="input" id="en" name="name" value="${esc(p.name)}" required maxlength="80">`)}
            <div class="grid g2">
              ${field("er", "Role", `<select class="input" id="er" name="role">${roleOptions(p.role)}</select>`)}
              ${field("em2", "Reports to", `<select class="input" id="em2" name="manager_id">${managerOptions(p.manager_id, p.id)}</select>`)}
              ${workInputs(p, "e")}
            </div>
            ${contact ? `<h3 class="mt">Contact (added by them)</h3><dl class="kv mt">${contact}</dl>` : ""}
            <div class="head mt"><span></span><span class="stat"><button class="btn btn--quiet" type="button" data-dlg-close>Cancel</button><button class="btn" type="submit">Save</button></span></div>
          </form>${deptList()}`, true);
        return;
      }
      case "signout-person": {
        const p = PEOPLE.find((x) => x.id === id);
        if (!(await confirmBox(`Sign ${p.name} out everywhere?`, "For example if a laptop or phone is lost. They can sign in again with Google; to block them, disable the account instead.", "Sign out", true))) return;
        return run(() => api(`/admin/people/${id}/sign-out`, {}), `${p.name} was signed out on every device.`);
      }
      case "toggle-person": {
        const p = PEOPLE.find((x) => x.id === id);
        if (p.active && !(await confirmBox(`Disable ${p.name}?`, "They're signed out immediately and can't sign in until you enable them again. Their records are kept.", "Disable", true))) return;
        return run(() => api(`/admin/people/${id}`, { active: !p.active }), p.active ? `${p.name} disabled.` : `${p.name} enabled.`);
      }
      case "remove-holiday":
        return run(() => api(`/admin/holidays/${id}/delete`, {}), "Holiday removed.");
      case "sign-out-others":
        return run(() => api("/sign-out-others", {}), "Signed out of all other devices.");
    }
  });

  document.addEventListener("submit", async (e) => {
    const f = e.target.closest("form[data-form]");
    if (!f) return;
    e.preventDefault();
    const fd = new FormData(f);
    const v = Object.fromEntries([...fd.entries()].filter(([, x]) => typeof x === "string"));
    const btn = e.submitter;
    // A double click must not send the same request twice.
    if (f.dataset.busy) return;
    f.dataset.busy = "1";
    const buttons = [...f.querySelectorAll("button")];
    buttons.forEach((b) => { b.disabled = true; });
    try { await submitForm(f, fd, v, btn); }
    finally { delete f.dataset.busy; buttons.forEach((b) => { b.disabled = false; }); }
  });
  async function submitForm(f, fd, v, btn) {
    const work = { employee_code: v.employee_code, department: v.department, designation: v.designation, joining_date: v.joining_date };
    switch (f.dataset.form) {
      case "leave": {
        const file = fd.get("doc");
        let doc;
        if (file && file.size) {
          if (file.size > 1024 * 1024) { flash("err", "Documents must be 1 MB or smaller."); return go("leave", true); }
          doc = { name: file.name, data: await fileToBase64(file) };
        }
        return run(() => api("/leave", { ...v, half_day: fd.has("half_day"), leave_type_id: Number(v.leave_type_id), doc }), "Leave request sent.");
      }
      case "correction":
        closeDialog();
        return run(() => api("/corrections", v), "Correction sent for approval.", "today");
      case "decide":
        return run(() => api(`/approvals/${f.dataset.kind}/${f.dataset.id}`, { decision: btn.value, note: v.note }), btn.value === "approved" ? "Approved." : "Rejected.");
      case "report":
        REPORT = { type: v.type, from: v.from, to: v.to, person: v.person || "", department: v.department || "" };
        return VIEWS.reports().catch((err) => { flash("err", err.message); go("reports", true); });
      case "add-person":
        try {
          const r = await api("/admin/people", { name: v.name, email: v.email, role: v.role, manager_id: v.manager_id ? Number(v.manager_id) : null, ...work });
          flash("ok", `Account created. ${r.email} can now sign in with Google.`); await go("people", true);
        } catch (err) { flash("err", err.message); go("people", true); }
        return;
      case "edit-person":
        closeDialog();
        return run(() => api(`/admin/people/${f.dataset.id}`, { name: v.name, role: v.role, manager_id: v.manager_id ? Number(v.manager_id) : null, ...work }), "Saved.");
      case "save-type":
        return run(() => api("/admin/leave-types" + (f.dataset.id ? "/" + f.dataset.id : ""), {
          name: v.name, yearly_quota: v.yearly_quota === "" ? null : Number(v.yearly_quota), accrual: v.accrual, accrual_days: v.accrual_days === "" ? null : Number(v.accrual_days),
          doc_after_days: v.doc_after_days === "" ? null : Number(v.doc_after_days), active: f.dataset.id ? fd.has("active") : true,
        }), "Leave type saved.");
      case "settings": {
        const weekend = [0, 1, 2, 3, 4, 5, 6].filter((n) => fd.has("off_" + n)).join(",");
        const keys = ["shift_start", "shift_end", "grace_min", "idle_minutes", "full_day_hours", "half_day_hours", "office_lat", "office_lon", "office_radius_m"];
        return run(() => api("/admin/settings", { ...Object.fromEntries(keys.map((k) => [k, v[k]])), weekend }), "Settings saved.");
      }
      case "add-holiday":
        return run(() => api("/admin/holidays", v), "Holiday added.");
      case "profile":
        return run(() => api("/profile", v), "Details saved.");
    }
  }

  window.addEventListener("hashchange", () => go(current()));
  (async () => {
    await refreshMe();
    document.getElementById("who").innerHTML = `${esc(ME.user.name)} · ${ROLE[ME.user.role]}`;
    go(current(), true);
  })();
})();
</script>
</body>
</html>
